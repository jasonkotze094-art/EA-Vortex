name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect the active Java major version."
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore detected."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file at $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: File $EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK verified successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${RUNNER_TEMP}/release-asset-dir"
          mkdir -p "$TEMP_ASSET_DIR"

          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_FILEPATH="${TEMP_ASSET_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_FILEPATH"

          if [ ! -f "$RELEASE_FILEPATH" ] || [ ! -s "$RELEASE_FILEPATH" ]; then
            echo "Error: Prepared release asset does not exist or is empty at $RELEASE_FILEPATH"
            exit 1
          fi

          echo "asset_path=${RELEASE_FILEPATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $RELEASE_FILEPATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          RUN_NUM: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh --version
          if ! command -v gh >/dev/null 2>&1; then
            echo "Error: GitHub CLI is not available."
            exit 1
          fi

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset is not a .apk file."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${RUN_NUM}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUM}"

          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build #${RUN_NUM}

          - **Build Source**: This is an automatically generated debug APK.
          - **Builder**: The APK was built by GitHub Actions.
          - **Run Number**: ${RUN_NUM}
          - **Run Attempt**: ${RUN_ATTEMPT}
          - **Source Commit**: \`${COMMIT_SHA}\`
          - **Testing Notice**: The APK is intended for testing and development validation.
          - **Production Notice**: The APK is not a Play Store production release.
          - **Signing**: The APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$COMMIT_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUM: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          RELEASE_TAG="debug-apk-build-${RUN_NUM}-${RUN_ATTEMPT}"
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "Release creation succeeded."
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${RUN_NUM}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## :white_check_mark: Debug APK Build & Release Succeeded"
              echo ""
              echo "### :rocket: Direct Download"
              echo "The debug APK can be downloaded directly from the GitHub Release Assets section:"
              echo "- **Release Page:** [$RELEASE_TAG]($RELEASE_URL)"
              echo "- **APK Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "### :package: Actions Artifact Backup"
              echo "The normal Actions artifact named **\`app-debug-apk\`** is also preserved and available as a backup under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing was not completed. Inspect the release step logs for details."
            echo "APK build succeeded. The Actions artifact named 'app-debug-apk' remains available."

            {
              echo "## :warning: Debug APK Built (Release Publishing Incomplete)"
              echo ""
              echo "The debug APK was built successfully! However, publishing to GitHub Releases encountered an issue."
              echo ""
              echo "### :package: Download via Actions Artifact"
              echo "You can download the APK from the **\`app-debug-apk\`** artifact in the Artifacts section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
